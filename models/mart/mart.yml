version: 2

 

models:
    - name: antarctica
      description: "dbt model to create the country details antarctica table"
      columns:
          - name: "(country_code||language_code||country_currency||country_capital_name)"
            description: "The primary key combination for this table"
            tests:
                - unique
                - not_null
          - name: country_continent_name
            description: "The column containing the country continent"
            tests:
              - accepted_values:
                  values: ['Antarctica']
